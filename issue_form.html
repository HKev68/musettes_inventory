<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open GitHub issue form</title>
    <link rel="stylesheet" href="web.css" />
  </head>
  <body>
    <main class="issue-page">
      <h1>Open the GitHub issue form</h1>
      <p class="intro">
        This page opens the GitHub issue template defined in the repository so you can submit a musette entry through the YAML form.
      </p>

      <form id="issueForm" class="issue-form">
        <label for="repoUrl">GitHub repository URL</label>
        <input id="repoUrl" name="repoUrl" type="url" placeholder="https://github.com/owner/repo" required />

        <button type="submit">Open issue form</button>
      </form>
    </main>

    <script>
      document.getElementById('issueForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const repoUrl = document.getElementById('repoUrl').value.trim();

        if (!repoUrl) {
          alert('Please provide a repository URL.');
          return;
        }

        const normalizedRepoUrl = repoUrl.replace(/\/+$/, '');
        const issueUrl = `${normalizedRepoUrl}/issues/new?template=add-musette.yml`;

        window.open(issueUrl, '_blank', 'noopener,noreferrer');
      });
    </script>
  </body>
</html>
